buildscript {
    dependencies {
        classpath files(
                'libs/ForgeGradle-5.1.77.jar',
                'libs/artifactural-3.0.14.jar',
                'libs/srgutils-0.4.15.jar',
                'libs/DiffPatch-2.0.12-all.jar',
                'libs/JarJarMetadata-0.3.19.jar',
                'libs/JarJarSelector-0.3.19.jar',
                'libs/httpclient-4.5.13.jar',
                'libs/httpcore-4.4.15.jar'
        )
        classpath 'com.google.guava:guava:31.1-jre'
        classpath 'com.google.code.gson:gson:2.9.0'
        classpath 'commons-io:commons-io:2.11.0'
        classpath 'de.siegmar:fastcsv:2.2.0'
        classpath 'org.apache.maven:maven-artifact:3.8.5'
        classpath 'net.sf.opencsv:opencsv:2.3'
        classpath 'commons-codec:commons-codec:1.15'
        classpath 'commons-logging:commons-logging:1.2'
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

apply plugin: net.minecraftforge.gradle.userdev.UserDevPlugin

version = '1.0.0'
group = 'com.pulsevisual'
archivesBaseName = 'pulsevisual'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                pulsevisual {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}